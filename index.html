<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Leveled Tapper</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a1a; /* Чуть светлее фон */
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none; /* Запрет выделения текста */
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .level-text {
            font-size: 18px;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .score-container {
            font-size: 48px;
            font-weight: 800;
        }

        .character-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .character {
            width: 100%;
            height: 100%;
            /* Начальная картинка будет установлена через JS */
            background-size: cover;
            background-position: center;
            border-radius: 20px; /* Скруглим углы, так как картинки квадратные */
            cursor: pointer;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Пружинящая анимация */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            -webkit-tap-highlight-color: transparent;
            z-index: 2;
        }

        .character:active {
            transform: scale(0.93); /* Эффект нажатия */
        }

        /* Крутое свечение за персонажем */
        .glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            background: radial-gradient(circle, rgba(255,215,0,0.4) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        .float-text {
            position: absolute;
            color: #ffffff;
            text-shadow: 0 0 5px #ffd700;
            font-size: 28px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 10;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="level-text" id="levelLabel">Уровень 1</div>
        <div class="score-container">
            <span id="score">0</span>
        </div>
    </div>

    <div class="character-container">
        <div class="glow"></div>
        <div class="character" id="clickBtn"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // === НАСТРОЙКА КАРТИНОК ===
        // ВАЖНО: Замени эти ссылки на свои прямые ссылки на загруженные картинки!
        const levelImages = {
            1: https://github.com/Vladiklegend/-/blob/main/photo_2025-12-29_23-57-27.jpg
            2: https://github.com/Vladiklegend/-/blob/main/photo_2025-12-29_23-57-24.jpg
            3: https://github.com/Vladiklegend/-/blob/main/photo_2025-12-29_23-57-14.jpg
        };
        // ==========================

        let score = 0;
        let currentLevel = 1;
        const scoreElement = document.getElementById('score');
        const levelLabelElement = document.getElementById('levelLabel');
        const clickArea = document.getElementById('clickBtn');

        // Загрузка сохраненного счета
        if (localStorage.getItem('myScore')) {
            score = parseInt(localStorage.getItem('myScore'));
            scoreElement.innerText = score;
        }

        // Функция проверки и обновления уровня
        function checkAndUpdateLevel() {
            let newLevel = 1;

            if (score >= 1000) {
                newLevel = 3;
            } else if (score >= 100) {
                newLevel = 2;
            } else {
                newLevel = 1;
            }

            // Если уровень изменился или это первая загрузка
            if (newLevel !== currentLevel || !clickArea.style.backgroundImage) {
                currentLevel = newLevel;
                // Меняем картинку
                clickArea.style.backgroundImage = `url('${levelImages[currentLevel]}')`;
                // Меняем текст уровня
                levelLabelElement.innerText = `Уровень ${currentLevel}`;
                
                // Дополнительная вибрация при повышении уровня, если это не старт игры
                if (score > 0 && tg.HapticFeedback) {
                     tg.HapticFeedback.notificationOccurred('success');
                }
            }
        }

        // Вызываем проверку уровня при запуске
        checkAndUpdateLevel();

        clickArea.addEventListener('click', (e) => {
            // Увеличиваем счет
            score++;
            scoreElement.innerText = score;
            localStorage.setItem('myScore', score);

            // Проверяем, не пора ли сменить уровень
            checkAndUpdateLevel();

            // Вибрация
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            // Анимация +1
            const floatText = document.createElement('div');
            floatText.classList.add('float-text');
            floatText.innerText = `+${currentLevel}`; // Даем монеток в зависимости от уровня (по желанию)
            
            const rect = clickArea.getBoundingClientRect();
            const randomX = (Math.random() - 0.5) * 60; 
            
            floatText.style.left = `${e.clientX - 20}px`; // Центрируем относительно клика
            floatText.style.top = `${e.clientY - 40}px`;
            
            document.body.appendChild(floatText);

            setTimeout(() => {
                floatText.remove();
            }, 800);
        });
    </script>
</body>
</html>
